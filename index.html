<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reformada FC - Sorteador</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #1e88c8, #000);
        color: white;
        text-align: center;
    }

    .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 20px 0;
    }

    .logo {
        width: 155px;
        height: auto;
        margin-bottom: 10px;
    }

    h1 {
        margin: 10px 0 20px;
        letter-spacing: 2px;
    }

    .formulario {
        max-width: 600px;
        margin: auto;
        background: rgba(255,255,255,0.12);
        padding: 20px;
        border-radius: 12px;
        text-align: left;
        color: white;
    }

    label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    #listaJogadores {
        max-height: 250px;
        overflow-y: auto;
        background: linear-gradient(135deg, #0d47a1, #1976d2);
        padding: 10px 15px;
        border-radius: 8px;
        border: 1px solid #1565c0;
        margin-top: 10px;
    }

    #listaJogadores label {
        user-select: none;
        display: block;
        margin-bottom: 6px;
    }

    #listaJogadores input[type="checkbox"] {
        margin-right: 8px;
        transform: scale(1.2);
        vertical-align: middle;
        cursor: pointer;
    }

    input[type="number"] {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border-radius: 6px;
        border: none;
        font-size: 16px;
    }

    button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background: #ffd700;
        color: #0b2c6d;
        width: 100%;
    }

    button:hover {
        opacity: 0.9;
    }

    #quantidadeSelecionada {
        margin-top: 15px;
        font-weight: bold;
        font-size: 18px;
        text-align: center;
    }

    .times {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 30px 10px;
        flex-wrap: wrap;
    }

    .time {
        width: 220px;
        padding: 12px;
        border-radius: 12px;
        background: white;
        color: black;
    }

    .time.vermelho {
        background: #c62828;
        color: white;
    }

    .time.azul {
        background: #1565c0;
        color: white;
    }

    .time.extra {
        background: #f5f5f5;
        color: black;
    }

    .time h3 {
        margin-top: 0;
        border-bottom: 1px solid rgba(255,255,255,0.4);
        padding-bottom: 5px;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        margin: 5px 0;
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
        .logo {
            width: 100px;
        }

        h1 {
            font-size: 24px;
        }

        .formulario {
            margin: 10px;
            padding: 15px;
        }

        #listaJogadores {
            max-height: 180px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
        }

        .times {
            flex-direction: column;
            align-items: center;
        }

        .time {
            width: 100%;
            max-width: 320px;
        }
    }
</style>
</head>

<body>

<div class="header">
    <img src="img/brasao_reformados_fc.jpeg" alt="Brasão Reformada FC" class="logo" />
    <h1>REFORMADA FC</h1>
</div>

<div class="formulario">

    <label>Selecione os jogadores presentes:</label>
    <div id="listaJogadores"></div>

    <div id="quantidadeSelecionada">
        Jogadores selecionados: 0
    </div>

    <div id="configTimes" style="display:none; margin-top:20px;">

        <label for="numTimes">
            Quantos times?
        </label>

        <input
            type="number"
            id="numTimes"
            placeholder="Ex: 2"
            min="2"
        />

        <button onclick="escolherGoleiros()">
            Continuar
        </button>

    </div>

    <div id="goleirosContainer" style="display:none; margin-top:20px;">

        <h3>Escolha os goleiros</h3>

        <p>
            Selecione exatamente a mesma quantidade de goleiros que a quantidade de times.
        </p>

        <div id="listaGoleiros"></div>

        <button onclick="sortear()">
            ⚽ Sortear Times
        </button>

    </div>

</div>

<div id="resultado" class="times"></div>

<script>

const jogadoresBase = [
    { nome: "João", nota: 3 },
    { nome: "Martin", nota: 4 },
    { nome: "Arthur", nota: 5 },
    { nome: "Júlio", nota: 5 },
    { nome: "Alex", nota: 3 },
    { nome: "Fabinho", nota: 5 },
    { nome: "Thales", nota: 4 },
    { nome: "Dêniz", nota: 5 },
    { nome: "Felipe", nota: 2 },
    { nome: "Mateus", nota: 2 },
    { nome: "Iury", nota: 5 },
    { nome: "Jonatas", nota: 4 },
    { nome: "Luiz Holanda", nota: 4 },
    { nome: "Iranildo", nota: 2 },
    { nome: "Biu", nota: 5 },
    { nome: "Hermes", nota: 4 },
    { nome: "Eduardo", nota: 4 },
    { nome: "Miguel", nota: 2 },
    { nome: "Renato", nota: 5 },
    { nome: "Sales", nota: 3 },
    { nome: "Severino", nota: 4 },
    { nome: "Anderson", nota: 3 },
    { nome: "Neto Lins", nota: 2 },
    { nome: "Madson", nota: 3 },
    { nome: "Thyago", nota: 3 },
    { nome: "Chris", nota: 2 },
    { nome: "Elias", nota: 4 }
];



function calcularOverall(jogador) {
    return jogador.nota;

}   

const listaJogadoresDiv = document.getElementById("listaJogadores");
const quantidadeSelecionadaDiv = document.getElementById("quantidadeSelecionada");
const configTimesDiv = document.getElementById("configTimes");

function gerarListaJogadores() {
    // Mostrar lista dos jogadoresBase com checkbox
    jogadoresBase
        .sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'))
        .forEach(jogador => {
            const label = document.createElement("label");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = jogador.nome.toLowerCase();
            checkbox.name = "jogador";
            checkbox.checked = (jogador.nome.toLowerCase() === "thales" || jogador.nome.toLowerCase() === "dêniz"); // Thales e Deniz já marcados
            checkbox.disabled = (jogador.nome.toLowerCase() === "thales" || jogador.nome.toLowerCase() === "dêniz"); // Não pode desmarcar
            checkbox.addEventListener("change", atualizarSelecionados);
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(" " + jogador.nome));
            listaJogadoresDiv.appendChild(label);
        });
    atualizarSelecionados();
}

function atualizarSelecionados() {
    const selecionados = document.querySelectorAll('input[name="jogador"]:checked');
    const qtd = selecionados.length;
    quantidadeSelecionadaDiv.textContent = `Jogadores selecionados: ${qtd}`;
    configTimesDiv.style.display = qtd > 0 ? "block" : "none";
    document.getElementById("resultado").innerHTML = ""; // limpa resultado ao mudar seleção
}

function sortear() {
    const selecionados = Array.from(document.querySelectorAll('input[name="jogador"]:checked'))
        .map(cb => cb.value);

    const jogadoresPorTime = parseInt(document.getElementById("jogadoresPorTime").value);
    const numTimes = parseInt(document.getElementById("numTimes").value);
    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "";

    if (selecionados.length === 0) {
        alert("Selecione pelo menos um jogador.");
        return;
    }
    if (!jogadoresPorTime || jogadoresPorTime < 1) {
        alert("Digite um número válido de jogadores por time.");
        return;
    }
    if (!numTimes || numTimes < 1) {
        alert("Digite um número válido de times.");
        return;
    }

    if (jogadoresPorTime * numTimes > selecionados.length) {
        alert(`Número insuficiente de jogadores para ${numTimes} times com ${jogadoresPorTime} jogadores cada.`);
        return;
    }

    // Preparar lista jogadores com scores
    let jogadores = selecionados.map(nome => {
        const jogadorObj = jogadoresBase.find(j => j.nome.toLowerCase() === nome);
        return {
            nome: jogadorObj.nome,
            score: calcularOverall(jogadorObj)
        };
    });

    // Sortear jogadores
    // Goleiros escolhidos pelo usuário
const goleirosSelecionados = Array.from(
    document.querySelectorAll(".goleiro:checked")
).map(g => g.value);

// Validação
if (goleirosSelecionados.length !== numTimes) {
    alert(
        `Selecione exatamente ${numTimes} goleiro(s).`
    );
    return;
}

// Busca os objetos dos goleiros
const goleiros = jogadores.filter(j =>
    goleirosSelecionados.includes(
        j.nome.toLowerCase()
    )
);

// Remove goleiros da lista principal
jogadores = jogadores.filter(j =>
    !goleirosSelecionados.includes(
        j.nome.toLowerCase()
    )
);

// Cria os times
let times = Array.from(
    { length: numTimes },
    () => ({
        jogadores: [],
        soma: 0
    })
);

// Coloca 1 goleiro em cada time
goleiros.forEach((goleiro, index) => {

    times[index].jogadores.push(
        "🥅 " + goleiro.nome
    );

    times[index].soma += goleiro.score;

});

    jogadores.forEach(jogador => {
        // candidatos são times que não estão cheios
        let candidatos = times.filter(t => t.jogadores.length < jogadoresPorTime);

        if (candidatos.length === 0) {
            // Todos os times cheios, jogador fica sobrante
            sobrantes.push(jogador);
            return;
        }

        // Seleciona o time que tem menor soma overall
        candidatos.sort((a,b) => a.soma - b.soma);

        // Verifica se jogador pode entrar no time com menor soma sem causar desequilíbrio
        // Se a diferença entre o time mais forte e o time atual for maior que maxDifference, permite jogador para equilibrar
        // Senão, jogador fica sobrante para tentar manter equilíbrio

        let timeMaisForte = Math.max(...times.map(t => t.soma));
        let timeMaisFraco = candidatos[0];

        if ((timeMaisForte - (timeMaisFraco.soma + jogador.score)) <= maxDifference) {
            // Pode adicionar no time
            timeMaisFraco.jogadores.push(jogador.nome);
            timeMaisFraco.soma += jogador.score;
        } else {
            // Jogador fica sobrante
            sobrantes.push(jogador);
        }
    });

    // Mostrar resultados
    times.forEach((t, i) => {
        const classe = (i % 2 === 0) ? "vermelho" : "azul";
        let div = document.createElement("div");
        div.className = "time " + classe;
        div.innerHTML = `<h3>Time ${i+1} (Overall: ${t.soma})</h3><ul>` +
            t.jogadores.map(j => `<li>${j}</li>`).join("") +
            "</ul>";
        resultado.appendChild(div);
    });

    if (sobrantes.length > 0) {
        let div = document.createElement("div");
        div.className = "time extra";
        div.innerHTML = `<h3>Jogadores sobrantes</h3><ul>` +
            sobrantes.map(j => `<li>${j.nome}</li>`).join("") +
            "</ul>";
        resultado.appendChild(div);
    }
}

// Gerar lista ao carregar a página
gerarListaJogadores();
</script>

</body>
</html>
