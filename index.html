<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reformada FC - Sorteador</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #1e88c8, #000);
        color: white;
        text-align: center;
    }

    .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 20px 0;
    }

    .logo {
        width: 155px;
        height: auto;
        margin-bottom: 10px;
    }

    h1 {
        margin: 10px 0 20px;
        letter-spacing: 2px;
    }

    .formulario {
        max-width: 600px;
        margin: auto;
        background: rgba(255,255,255,0.12);
        padding: 20px;
        border-radius: 12px;
        text-align: left;
        color: white;
    }

    label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    #listaJogadores {
        max-height: 250px;
        overflow-y: auto;
        background: linear-gradient(135deg, #0d47a1, #1976d2);
        padding: 10px 15px;
        border-radius: 8px;
        border: 1px solid #1565c0;
        margin-top: 10px;
    }

    #listaJogadores label {
        user-select: none;
        display: block;
        margin-bottom: 6px;
    }

    #listaJogadores input[type="checkbox"] {
        margin-right: 8px;
        transform: scale(1.2);
        vertical-align: middle;
        cursor: pointer;
    }

    input[type="number"] {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border-radius: 6px;
        border: none;
        font-size: 16px;
    }

    button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background: #ffd700;
        color: #0b2c6d;
        width: 100%;
    }

    button:hover {
        opacity: 0.9;
    }

    #quantidadeSelecionada {
        margin-top: 15px;
        font-weight: bold;
        font-size: 18px;
        text-align: center;
    }

    .times {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 30px 10px;
        flex-wrap: wrap;
    }

    .time {
        width: 220px;
        padding: 12px;
        border-radius: 12px;
        background: white;
        color: black;
    }

    .time.vermelho {
        background: #c62828;
        color: white;
    }

    .time.azul {
        background: #1565c0;
        color: white;
    }

    .time.extra {
        background: #f5f5f5;
        color: black;
    }

    .time h3 {
        margin-top: 0;
        border-bottom: 1px solid rgba(255,255,255,0.4);
        padding-bottom: 5px;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        margin: 5px 0;
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
        .logo {
            width: 100px;
        }

        h1 {
            font-size: 24px;
        }

        .formulario {
            margin: 10px;
            padding: 15px;
        }

        #listaJogadores {
            max-height: 180px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
        }

        .times {
            flex-direction: column;
            align-items: center;
        }

        .time {
            width: 100%;
            max-width: 320px;
        }
    }
</style>
</head>

<body>

<div class="header">
    <img src="img/brasao_reformados_fc.jpeg" alt="Brasão Reformada FC" class="logo" />
    <h1>REFORMADA FC</h1>
</div>

<div class="formulario">
    <label>Selecione os jogadores presentes:</label>
    <div id="listaJogadores"></div>

    <div id="quantidadeSelecionada">Jogadores selecionados: 0</div>

    <div id="configTimes" style="display:none; margin-top: 20px;">
        <label for="jogadoresPorTime">Quantidade de jogadores por time</label>
        <input type="number" id="jogadoresPorTime" placeholder="Ex: 5" min="1" />

        <label for="numTimes" style="margin-top: 15px;">Quantos times?</label>
        <input type="number" id="numTimes" placeholder="Ex: 4" min="1" />

        <button onclick="sortear()">Sortear Times</button>
    </div>
</div>

<div id="resultado" class="times"></div>

<script>
const PESOS = {
    idade: { novo: 1, medio: 2, velho: 3 },
    altura: { baixo: 1, medio: 2, alto: 3 },
    porte: { magro: 1, medio: 2, gordo: 3 }
};

function calcularOverall({ idade, altura, porte, habilidade }) {
    return (
        PESOS.idade[idade] +
        PESOS.altura[altura] +
        PESOS.porte[porte] +
        habilidade
    );
}

const jogadoresBase = {
    "thales": calcularOverall({ idade:"medio", altura:"alto", porte:"gordo", habilidade:5 }),
    "dêniz": calcularOverall({ idade:"medio", altura:"medio", porte:"gordo", habilidade:5 }),
    "joão": calcularOverall({ idade:"medio", altura:"medio", porte:"medio", habilidade:4 }),
    "martin": calcularOverall({ idade:"medio", altura:"alto", porte:"medio", habilidade:4 }),
    "arthur": calcularOverall({ idade:"medio", altura:"medio", porte:"medio", habilidade:4 }),
    "júlio": calcularOverall({ idade:"novo", altura:"medio", porte:"magro", habilidade:5 }),
    "fabinho": calcularOverall({ idade:"medio", altura:"medio", porte:"gordo", habilidade:4 }),
    "mateus": calcularOverall({ idade:"novo", altura:"baixo", porte:"magro", habilidade:3 }),
    "iury": calcularOverall({ idade:"medio", altura:"alto", porte:"medio", habilidade:5 }),
    "jonatas": calcularOverall({ idade:"medio", altura:"medio", porte:"medio", habilidade:4 }),
    "luiz holanda": calcularOverall({ idade:"velho", altura:"medio", porte:"medio", habilidade:3 }),
    "iranildo": calcularOverall({ idade:"velho", altura:"medio", porte:"gordo", habilidade:3 }),
    "biu": calcularOverall({ idade:"medio", altura:"medio", porte:"medio", habilidade:4 }),
    "hermes": calcularOverall({ idade:"medio", altura:"baixo", porte:"medio", habilidade:3 }),
    "eduardo": calcularOverall({ idade:"novo", altura:"medio", porte:"magro", habilidade:4 }),
    "miguel": calcularOverall({ idade:"novo", altura:"medio", porte:"magro", habilidade:4 }),
    "renato": calcularOverall({ idade:"medio", altura:"alto", porte:"medio", habilidade:5 }),
    "sales": calcularOverall({ idade:"medio", altura:"medio", porte:"medio", habilidade:4 }),
    "severino": calcularOverall({ idade:"velho", altura:"baixo", porte:"medio", habilidade:3 }),
    "felipe": calcularOverall({ idade:"medio", altura:"baixo", porte:"magro", habilidade:3 }),
    "thyago": calcularOverall({ idade:"medio", altura:"baixo", porte:"medio", habilidade:3 }),
    "anderson": calcularOverall({ idade:"velho", altura:"alto", porte:"medio", habilidade:4 }),
    "neto lins": calcularOverall({ idade:"medio", altura:"alto", porte:"gordo", habilidade:4 }),
    "madson": calcularOverall({ idade:"velho", altura:"medio", porte:"gordo", habilidade:2 })
};

const listaJogadoresDiv = document.getElementById("listaJogadores");
const quantidadeSelecionadaDiv = document.getElementById("quantidadeSelecionada");
const configTimesDiv = document.getElementById("configTimes");

function gerarListaJogadores() {
    const nomes = Object.keys(jogadoresBase)
        .map(n => n.charAt(0).toUpperCase() + n.slice(1))
        .sort((a,b) => a.localeCompare(b, 'pt-BR'));

    nomes.forEach(nome => {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = nome.toLowerCase();
        checkbox.name = "jogador";
        checkbox.addEventListener("change", atualizarSelecionados);
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(" " + nome));
        listaJogadoresDiv.appendChild(label);
    });
}

function atualizarSelecionados() {
    const selecionados = document.querySelectorAll('input[name="jogador"]:checked');
    const qtd = selecionados.length;
    quantidadeSelecionadaDiv.textContent = `Jogadores selecionados: ${qtd}`;
    configTimesDiv.style.display = qtd > 0 ? "block" : "none";
    document.getElementById("resultado").innerHTML = ""; // limpa resultado ao mudar seleção
}

function sortear() {
    const selecionados = Array.from(document.querySelectorAll('input[name="jogador"]:checked'))
        .map(cb => cb.value);

    const jogadoresPorTime = parseInt(document.getElementById("jogadoresPorTime").value);
    const numTimes = parseInt(document.getElementById("numTimes").value);
    const resultado = document.getElementById("resultado");

    resultado.innerHTML = "";

    if(selecionados.length === 0) {
        alert("Selecione pelo menos um jogador.");
        return;
    }
    if(!jogadoresPorTime || jogadoresPorTime < 1) {
        alert("Digite um número válido de jogadores por time.");
        return;
    }
    if(!numTimes || numTimes < 1) {
        alert("Digite um número válido de times.");
        return;
    }

    if(jogadoresPorTime * numTimes > selecionados.length) {
        alert(`Número insuficiente de jogadores para ${numTimes} times com ${jogadoresPorTime} jogadores cada.`);
        return;
    }

    // Preparar lista jogadores com scores
    let jogadores = selecionados.map(n => ({
        nome: n,
        score: jogadoresBase[n.toLowerCase()] ?? 6
    }));

    // Separar goleiros
    const goleiros = jogadores.filter(j => j.nome === "thales" || j.nome === "dêniz");
    jogadores = jogadores.filter(j => j.nome !== "thales" && j.nome !== "dêniz");

    // Embaralhar jogadores (exceto goleiros)
    jogadores = jogadores.sort(() => Math.random() - 0.5);

    // Criar array dos times
    let times = Array.from({ length: numTimes }, () => ({
        jogadores: [],
        soma: 0
    }));

    // Alocar goleiros distribuindo 1 por time na ordem
    for(let i = 0; i < times.length; i++) {
        if(goleiros.length) {
            let g = goleiros[i % goleiros.length];
            times[i].jogadores.push(g.nome);
            times[i].soma += g.score;
        }
    }

    // Ordena jogadores restantes por score desc para balancear
    jogadores.sort((a,b) => b.score - a.score);

    // Distribuir jogadores nos times balanceando soma e respeitando limite por time
    jogadores.forEach(j => {
        let candidatos = times.filter(t => t.jogadores.length < jogadoresPorTime);
        if(candidatos.length === 0) return;
        let timeEscolhido = candidatos.reduce((a,b) => (a.soma < b.soma) ? a : b);
        timeEscolhido.jogadores.push(j.nome);
        timeEscolhido.soma += j.score;
    });

    // Jogadores sobrantes (não alocados)
    let alocados = times.flatMap(t => t.jogadores);
    let sobrantes = jogadores.map(j => j.nome).filter(n => !alocados.includes(n));

    // Mostrar resultados
    times.forEach((t, i) => {
        let div = document.createElement("div");
        div.className = "time " + (i % 2 === 0 ? "vermelho" : "azul");
        div.innerHTML = `<h3>Time ${i+1} (Overall: ${t.soma})</h3><ul>` +
            t.jogadores.map(j => `<li>${j}</li>`).join("") +
            "</ul>";
        resultado.appendChild(div);
    });

    if(sobrantes.length) {
        let div = document.createElement("div");
        div.className = "time extra";
        div.innerHTML = `<h3>Jogadores sobrantes</h3><ul>` +
            sobrantes.map(j => `<li>${j}</li>`).join("") +
            "</ul>";
        resultado.appendChild(div);
    }
}

// Gerar lista ao carregar a página
gerarListaJogadores();
</script>

</body>
</html>
